<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Aetheria favicon: pixel-art downward sword on deep navy background. -->
  <!-- Matches the canvas game's icon language (gear.js uses '↑' for swords). -->

  <!-- Background: deep navy with subtle vignette -->
  <rect width="32" height="32" fill="#1a1a2e"/>

  <!-- Sword hilt: brown grip at top (rows 4-7, cols 14-17) -->
  <rect x="14" y="4" width="4" height="1" fill="#5a3a1a"/>
  <rect x="14" y="5" width="4" height="3" fill="#7a4a2a"/>
  <rect x="14" y="7" width="4" height="1" fill="#3a2010"/>

  <!-- Cross-guard: gold horizontal bar (row 8, cols 10-21) -->
  <rect x="10" y="8" width="12" height="1" fill="#ffcf4d"/>
  <rect x="10" y="9" width="12" height="1" fill="#aa7a1a"/>
  <rect x="11" y="10" width="10" height="1" fill="#7a5a10"/>

  <!-- Blade: silver tapering down (rows 11-26, cols 14-17 narrowing) -->
  <rect x="15" y="11" width="2" height="14" fill="#e8e8f0"/>
  <rect x="14" y="11" width="1" height="14" fill="#a8a8c0"/>
  <rect x="17" y="11" width="1" height="14" fill="#a8a8c0"/>

  <!-- Center fuller (darker line down the blade) -->
  <rect x="15" y="12" width="2" height="12" fill="#c8c8d8"/>

  <!-- Blade tip (rows 25-27, narrowing to point) -->
  <rect x="15" y="25" width="2" height="1" fill="#e8e8f0"/>
  <rect x="15" y="26" width="2" height="1" fill="#a8a8c0"/>
  <rect x="16" y="27" width="1" height="1" fill="#7a7a90"/>

  <!-- Subtle highlight on the blade edge -->
  <rect x="14" y="11" width="1" height="14" fill="#ffffff" opacity="0.6"/>

  <!-- Pommel: small gold ball at top of grip -->
  <rect x="15" y="3" width="2" height="1" fill="#ffcf4d"/>
  <rect x="15" y="2" width="2" height="1" fill="#aa7a1a"/>
</svg>
